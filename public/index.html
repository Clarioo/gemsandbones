<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gems and Bones</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Gems &amp; Bones</h1>

      <!-- Shown when logged out -->
      <section id="login-view" hidden>
        <p>A browser card game. Sign in with your Discord account to play.</p>
        <a class="btn discord" href="/auth/discord">Login with Discord</a>
      </section>

      <!-- Shown after login, before a class is chosen -->
      <section id="setup-view" hidden>
        <p>Welcome, <b id="setup-name"></b>. Choose your class:</p>
        <div id="class-grid" class="class-grid"></div>
      </section>

      <!-- Shown when logged in and set up -->
      <section id="app-view" hidden>
        <header class="topbar">
          <div id="profile" class="profile"></div>
          <div class="spacer"></div>
          <span class="pill">Players online: <b id="player-count">0</b></span>
          <button id="logout-btn" class="btn ghost">Log out</button>
        </header>

        <section id="sheet" class="sheet">
          <div class="sheet-head">
            <h2 id="sheet-title">Character</h2>
            <label class="level-control">
              Level
              <input id="level-input" type="number" min="1" max="50" value="1" />
            </label>
          </div>
          <p class="hint level-note">
            Level can be set by hand for now so you can see the stats scale &mdash;
            XP-based leveling comes later.
          </p>
          <div id="stat-groups" class="stat-groups"></div>
        </section>

        <h2>Lobby</h2>
        <ul id="messages" class="messages"></ul>

        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" type="text" placeholder="Say something to the lobby&hellip;" maxlength="500" />
          <button type="submit" class="btn">Send</button>
        </form>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
